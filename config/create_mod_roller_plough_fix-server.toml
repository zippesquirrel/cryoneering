#Settings for functionality added to Sable simulated contraptions.
[simulated_behavior]
	#Master switch for all simulated Plough and Roller behavior added by this mod.
	enabled = true

	[simulated_behavior.mechanical_plough]
		#Allow Mechanical Ploughs on simulated contraptions to act in the main world.
		enabled = true

	[simulated_behavior.mechanical_roller]
		#Allow Mechanical Rollers on simulated contraptions to pave and clear blocks in the main world.
		enabled = true
		#How many blocks above the paved surface a simulated roller clears.
		#0 keeps overhead blocks, 2 matches this mod's default simulated Roller behavior.
		# Default: 2
		# Range: 0 ~ 2
		clear_headroom_blocks = 2
		#Require the paving block to be available in an inventory carried by the same simulated contraption.
		#Set to false for unlimited simulated paving.
		consume_paving_materials = true
		#How quickly a simulated roller's wheel eases to a stop after reversing.
		#1.0 stops immediately; smaller values coast longer.
		# Default: 0.25
		# Range: 0.01 ~ 1.0
		reverse_animation_easing = 0.25

#Settings that apply to Mechanical Rollers in every world.
[mechanical_roller]
	#Copy paving-filter changes to adjacent simulated Mechanical Rollers.
	#This setting does not alter ordinary, non-simulated Rollers.
	synchronize_adjacent_settings = false
