#Nutrition System Settings
[nutrition]
	#How much nutrition decreases per interval (default: 0.1)
	# Default: 0.1
	# Range: 0.0 ~ 10.0
	decayRate = 0.1
	#Ticks between decay updates (default: 100 = 5 seconds)
	# Default: 100
	# Range: 20 ~ 1200
	decayInterval = 100
	#Starting nutrition value for new players (default: 50)
	# Default: 50.0
	# Range: 0.0 ~ 100.0
	initialNutrition = 50.0

#Buff/Debuff Settings
[effects]
	#Nutrition level to gain buffs (default: 80)
	# Default: 80.0
	# Range: 50.0 ~ 100.0
	buffThreshold = 80.0
	#Nutrition level to get debuffs (default: 20)
	# Default: 20.0
	# Range: 0.0 ~ 50.0
	debuffThreshold = 20.0
	#Effect duration in ticks (default: 140 = 7 seconds)
	# Default: 140
	# Range: 20 ~ 1200
	effectDuration = 140

#Disease Settings
[disease]
	#Ticks of low nutrition before disease triggers (default: 6000 = 5 minutes)
	# Default: 6000
	# Range: 100 ~ 72000
	triggerTime = 6000
	#Immunity buff duration after recovery in ticks (default: 600 = 30 seconds)
	# Default: 600
	# Range: 100 ~ 6000
	immunityDuration = 600

#HUD Settings
[hud]
	#Show nutrition bars on screen (default: true)
	enabled = true
	#HUD X position offset from right edge (default: 90)
	# Default: 90
	# Range: 0 ~ 500
	xOffset = 90
	#HUD Y position offset from bottom (default: 60)
	# Default: 60
	# Range: 0 ~ 500
	yOffset = 60

#Tooltip Settings
[tooltip]
	#Show nutrition info in food tooltips (default: true)
	enabled = true
