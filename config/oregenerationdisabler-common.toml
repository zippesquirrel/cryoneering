[general]
	#If false, the mod will not disable any ore generation.
	enabled = true
	#Print debug information about removed ore features to the log.
	debugLogging = false
	#If false, only UNDERGROUND_ORES step is scanned. 
	#If true, all biome decoration steps are scanned. 
	#Enable only if some mod generates ores outside UNDERGROUND_ORES.
	scanAllGenerationSteps = false
	#Use ore list from config file.
	enableConfigOres = true
	#Use ores from biome modifier tags.
	enableTagOres = true

[ores]
	#List of ore block IDs that should not generate in the Overworld.
	#These are BLOCK IDs, not item IDs and not placed_feature IDs.
	#Example: minecraft:diamond_ore
	disabledOreBlockIds = ["minecraft:coal_ore", "minecraft:deepslate_coal_ore", "minecraft:iron_ore", "minecraft:deepslate_iron_ore", "minecraft:copper_ore", "minecraft:deepslate_copper_ore", "minecraft:gold_ore", "minecraft:deepslate_gold_ore", "minecraft:redstone_ore", "minecraft:deepslate_redstone_ore", "minecraft:lapis_ore", "minecraft:deepslate_lapis_ore", "minecraft:diamond_ore", "minecraft:deepslate_diamond_ore", "minecraft:emerald_ore", "minecraft:deepslate_emerald_ore"]
	#PlacedFeature IDs that should always be removed from Overworld biomes.
	#Use this for custom generators that cannot be detected by block ID.
	#Example: create:zinc_ore
	forceDisabledPlacedFeatureIds = []
